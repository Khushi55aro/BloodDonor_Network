{% extends 'base.html' %}

{% block title %}Contact Us{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm p-4">
                <h3 class="fw-bold mb-3"><i class="fa-solid fa-envelope text-danger me-2"></i>Contact Us</h3>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Name</label>
                        {{ form.name }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        {{ form.email }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Subject</label>
                        {{ form.subject }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Message</label>
                        {{ form.message }}
                    </div>
                    <button type="submit" class="btn btn-danger rounded-pill px-4">Send Message</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
