{% extends 'base.html' %}

{% block title %}User Profile{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-0 shadow-sm p-4">
                <div class="card-body">
                    <h3 class="fw-bold mb-4"><i class="fa-solid fa-user-gear text-danger me-2"></i>My User Profile</h3>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">First Name</label>
                                {{ form.first_name }}
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Last Name</label>
                                {{ form.last_name }}
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Email</label>
                                {{ form.email }}
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Phone</label>
                                {{ form.phone }}
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">City</label>
                                {{ form.city }}
                            </div>
                            <div class="col-md-12">
                                <label class="form-label fw-semibold small">Address</label>
                                {{ form.address }}
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Latitude (for Geo-Matching)</label>
                                {{ form.latitude }}
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Longitude (for Geo-Matching)</label>
                                {{ form.longitude }}
                            </div>
                        </div>

                        <div class="mt-4">
                            <button type="submit" class="btn btn-danger rounded-pill px-4">Update Profile</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
