{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login | BloodNet{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-header bg-danger text-white text-center py-4 border-0">
                    <h3 class="mb-0 fw-bold"><i class="fa-solid fa-droplet me-2"></i>Welcome Back</h3>
                    <p class="mb-0 text-white-50">Login to your account</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form method="POST">
                        {% csrf_token %}
                        {{ form|crispy }}
                        
                        <div class="d-flex justify-content-between align-items-center mb-4 mt-2">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rememberMe">
                                <label class="form-check-label text-muted small" for="rememberMe">
                                    Remember me
                                </label>
                            </div>
                            <a href="{% url 'accounts:password_reset' %}" class="text-danger small text-decoration-none">Forgot Password?</a>
                        </div>
                        
                        <button class="btn btn-danger w-100 rounded-pill py-2 fw-semibold shadow-sm mb-3" type="submit">
                            Login
                        </button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="text-muted small mb-0">Don't have an account? <a href="{% url 'accounts:register' %}" class="text-danger text-decoration-none fw-semibold">Register here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
