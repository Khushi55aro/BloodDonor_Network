{% extends 'base.html' %}

{% block title %}Password Updated | BloodNet{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card border-0 shadow-sm rounded-4 p-5 mx-auto" style="max-width: 500px;">
        <i class="fa-solid fa-circle-check text-success fs-1 mb-4"></i>
        <h3 class="fw-bold">Password Reset Complete</h3>
        <p class="text-muted">Your password has been successfully reset. You may go ahead and log in now.</p>
        <a href="{% url 'accounts:login' %}" class="btn btn-danger rounded-pill px-4 mt-3 shadow-sm">Log In</a>
    </div>
</div>
{% endblock %}
