{% extends 'base.html' %}

{% block title %}Email Sent | BloodNet{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card border-0 shadow-sm rounded-4 p-5 mx-auto" style="max-width: 500px;">
        <i class="fa-solid fa-envelope-circle-check text-success fs-1 mb-4"></i>
        <h3 class="fw-bold">Check Your Email</h3>
        <p class="text-muted">We've emailed you instructions for setting your password, if an account exists with the email you entered. You should receive them shortly.</p>
        <a href="{% url 'accounts:login' %}" class="btn btn-outline-danger rounded-pill px-4 mt-3">Back to Login</a>
    </div>
</div>
{% endblock %}
