{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Reset Password | BloodNet{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-header bg-danger text-white text-center py-4 border-0">
                    <h3 class="mb-0 fw-bold"><i class="fa-solid fa-key me-2"></i>Reset Password</h3>
                    <p class="mb-0 text-white-50">Enter your email to receive a reset link</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form method="POST">
                        {% csrf_token %}
                        {{ form|crispy }}
                        
                        <button class="btn btn-danger w-100 rounded-pill py-2 fw-semibold shadow-sm mt-3" type="submit">
                            Send Reset Email
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
