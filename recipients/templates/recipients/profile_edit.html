{% extends 'base.html' %}

{% block title %}Edit Recipient Details{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm p-4">
                <div class="card-body">
                    <h3 class="fw-bold mb-4"><i class="fa-solid fa-hospital-user text-primary me-2"></i>Edit Recipient Profile</h3>

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Primary Blood Group Needed</label>
                            {{ form.blood_group_needed }}
                        </div>

                        <div class="mt-4">
                            <button type="submit" class="btn btn-primary rounded-pill px-4">Save Changes</button>
                            <a href="{% url 'recipients:dashboard' %}" class="btn btn-light rounded-pill px-4 ms-2">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
