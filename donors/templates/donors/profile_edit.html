{% extends 'base.html' %}

{% block title %}Edit Donor Details{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm p-4">
                <div class="card-body">
                    <h3 class="fw-bold mb-4"><i class="fa-solid fa-droplet text-danger me-2"></i>Edit Donor Profile</h3>

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Blood Group</label>
                            {{ form.blood_group }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Last Donation Date</label>
                            {{ form.last_donation_date }}
                            <div class="form-text">System will apply a 90-day cooldown period from this date.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Availability Status</label>
                            {{ form.availability_status }}
                        </div>

                        <div class="mt-4">
                            <button type="submit" class="btn btn-danger rounded-pill px-4">Save Changes</button>
                            <a href="{% url 'donors:dashboard' %}" class="btn btn-light rounded-pill px-4 ms-2">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
